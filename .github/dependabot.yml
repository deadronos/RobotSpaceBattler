version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Held: postprocessing 6.39.5 peers three <0.187 (see #152 PR notes).
      - dependency-name: three
        versions: [">=0.187.0"]
      # Held: current build emits rapier chunk at ~851 kB gzip (0.19.x); 0.21
      # increased this further in prior validation. Revisit when rapier can be
      # loaded outside initial render path or upstream ships slimmer wasm.
      - dependency-name: "@dimforge/rapier3d-compat"
        versions: [">=0.20.0"]
