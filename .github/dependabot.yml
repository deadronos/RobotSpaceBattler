version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Held: postprocessing 6.39.5 peers three <0.187 (see #152 PR notes).
      - dependency-name: three
        versions: [">=0.187.0"]
      # Held: 0.21 adds ~827 kB gzip of embedded wasm; revisit with #159.
      - dependency-name: "@dimforge/rapier3d-compat"
        versions: [">=0.20.0"]
